name: Build Windows Executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install pandas openpyxl matplotlib numpy reportlab arabic-reshaper python-bidi
    
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "GoldenEagle" --add-data "golden_eagle_core.py;." --add-data "lang.py;." golden_eagle.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: GoldenEagle-Executable
        path: dist/GoldenEagle.exe
